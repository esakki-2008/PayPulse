<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 900" role="img" aria-labelledby="title desc">
<title id="title">PayPulse approval and execution flow</title>
<desc id="desc">PayPulse Phase 1 architecture diagram.</desc>
<style>
  .title { font: 700 25px Arial, Helvetica, sans-serif; fill: #14213d; }
  .subtitle { font: 400 14px Arial, Helvetica, sans-serif; fill: #52607a; }
  .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #14213d; }
  .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #34415c; }
  .tiny { font: 400 11px Arial, Helvetica, sans-serif; fill: #52607a; }
  .node { fill: #ffffff; stroke: #b9c5d8; stroke-width: 2; }
  .source { fill: #e6f4ff; stroke: #3b82b6; stroke-width: 2; }
  .data { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .intelligence { fill: #f3edff; stroke: #7956bf; stroke-width: 2; }
  .action { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .control { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
  .line { fill: none; stroke: #65758d; stroke-width: 2; marker-end: url(#arrow); }
  .line-soft { fill: none; stroke: #8797af; stroke-width: 1.6; marker-end: url(#arrow); }
  .line-loop { fill: none; stroke: #7956bf; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowPurple); }
  .lane { fill: #f8fafc; stroke: #d6deea; stroke-width: 1.5; }
  .participant { fill: #ffffff; stroke: #73839b; stroke-width: 1.5; }
  .life { stroke: #9aa8ba; stroke-width: 1.5; stroke-dasharray: 5 5; }
  .message { fill: none; stroke: #52657f; stroke-width: 1.7; marker-end: url(#arrow); }
  .message-return { fill: none; stroke: #52657f; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .state { fill: #ffffff; stroke: #65758d; stroke-width: 2; }
  .terminal { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .warn { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .reject { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758d"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7956bf"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>

<text x="70" y="56" class="title">Approval and execution flow</text>
<text x="70" y="82" class="subtitle">Merchant approval is recorded before any action is queued. PayPal interaction is limited to an approved Sandbox operation.</text>
<g>
  <rect x="70" y="120" width="125" height="54" rx="11" class="participant"/><text x="132" y="152" text-anchor="middle" class="small">Merchant</text>
  <rect x="260" y="120" width="120" height="54" rx="11" class="participant"/><text x="320" y="152" text-anchor="middle" class="small">UI / API</text>
  <rect x="445" y="120" width="135" height="54" rx="11" class="participant"/><text x="512" y="145" text-anchor="middle" class="small">Approval</text><text x="512" y="161" text-anchor="middle" class="small">Gate</text>
  <rect x="645" y="120" width="165" height="54" rx="11" class="participant"/><text x="727" y="145" text-anchor="middle" class="small">Execution</text><text x="727" y="161" text-anchor="middle" class="small">Orchestrator</text>
  <rect x="875" y="120" width="150" height="54" rx="11" class="participant"/><text x="950" y="152" text-anchor="middle" class="small">PayPal Sandbox</text>
  <rect x="1090" y="120" width="145" height="54" rx="11" class="participant"/><text x="1162" y="145" text-anchor="middle" class="small">Internal action</text><text x="1162" y="161" text-anchor="middle" class="small">handler</text>
  <rect x="1300" y="120" width="145" height="54" rx="11" class="participant"/><text x="1372" y="145" text-anchor="middle" class="small">Outcome</text><text x="1372" y="161" text-anchor="middle" class="small">Store</text>
  <path d="M132 174 V800 M320 174 V800 M512 174 V800 M727 174 V800 M950 174 V800 M1162 174 V800 M1372 174 V800" class="life"/>
  <path d="M132 230 H320" class="message"/><text x="226" y="219" text-anchor="middle" class="small">approve exact recommendation version</text>
  <path d="M320 300 H512" class="message"/><text x="416" y="289" text-anchor="middle" class="small">actor + version + acknowledgment</text>
  <path d="M512 370 H727" class="message"/><text x="619" y="359" text-anchor="middle" class="small">valid approval + immutable payload hash</text>
  <rect x="650" y="405" width="775" height="290" rx="14" class="lane"/>
  <text x="675" y="435" class="small">Execution revalidates policy, sandbox guard, approval hash, and idempotency key.</text>
  <path d="M727 480 H950" class="message"/><text x="838" y="469" text-anchor="middle" class="small">approved recovery: create Sandbox Order</text>
  <path d="M950 530 H727" class="message-return"/><text x="838" y="519" text-anchor="middle" class="small">Sandbox order ID + approval link</text>
  <path d="M727 590 H1162" class="message"/><text x="944" y="579" text-anchor="middle" class="small">or internal draft / task / review case</text>
  <path d="M1162 640 H727" class="message-return"/><text x="944" y="629" text-anchor="middle" class="small">tracked internal result</text>
  <path d="M727 745 H1372" class="message"/><text x="1049" y="734" text-anchor="middle" class="small">persist execution result + outcome event</text>
  <path d="M1372 800 H132" class="message-return"/><text x="752" y="789" text-anchor="middle" class="small">completed / needs attention; DNA refresh scheduled</text>
</g>

</svg>
