<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1000" role="img" aria-labelledby="title desc">
<title id="title">PayPulse action recommendation state machine</title>
<desc id="desc">PayPulse Phase 1 architecture diagram.</desc>
<style>
  .title { font: 700 25px Arial, Helvetica, sans-serif; fill: #14213d; }
  .subtitle { font: 400 14px Arial, Helvetica, sans-serif; fill: #52607a; }
  .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #14213d; }
  .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #34415c; }
  .tiny { font: 400 11px Arial, Helvetica, sans-serif; fill: #52607a; }
  .node { fill: #ffffff; stroke: #b9c5d8; stroke-width: 2; }
  .source { fill: #e6f4ff; stroke: #3b82b6; stroke-width: 2; }
  .data { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .intelligence { fill: #f3edff; stroke: #7956bf; stroke-width: 2; }
  .action { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .control { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
  .line { fill: none; stroke: #65758d; stroke-width: 2; marker-end: url(#arrow); }
  .line-soft { fill: none; stroke: #8797af; stroke-width: 1.6; marker-end: url(#arrow); }
  .line-loop { fill: none; stroke: #7956bf; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowPurple); }
  .state { fill: #ffffff; stroke: #65758d; stroke-width: 2; }
  .terminal { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .warn { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .reject { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758d"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7956bf"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>

<text x="70" y="56" class="title">Action recommendation state machine</text>
<text x="70" y="82" class="subtitle">Actions move from proposal through explicit approval to a durable result. Changed or ambiguous actions fail safely.</text>
<circle cx="100" cy="220" r="14" fill="#14213d"/><path d="M114 220 H200" class="line"/>
<rect x="200" y="178" width="165" height="84" rx="42" class="state"/><text x="282" y="227" text-anchor="middle" class="label">proposed</text>
<rect x="470" y="178" width="165" height="84" rx="42" class="state"/><text x="552" y="227" text-anchor="middle" class="label">in review</text>
<rect x="740" y="178" width="165" height="84" rx="42" class="control"/><text x="822" y="227" text-anchor="middle" class="label">approved</text>
<rect x="1010" y="178" width="165" height="84" rx="42" class="action"/><text x="1092" y="227" text-anchor="middle" class="label">queued</text>
<rect x="1280" y="178" width="185" height="84" rx="42" class="action"/><text x="1372" y="227" text-anchor="middle" class="label">executing</text>
<path d="M365 220 H470 M635 220 H740 M905 220 H1010 M1175 220 H1280" class="line"/>
<text x="686" y="205" text-anchor="middle" class="tiny">merchant approves exact version</text>
<!-- rejected / expired terminal branches -->
<rect x="470" y="420" width="165" height="84" rx="42" class="reject"/><text x="552" y="469" text-anchor="middle" class="label">rejected</text>
<path d="M552 262 V420" class="line"/><text x="572" y="345" class="tiny">merchant rejects</text>
<path d="M635 462 H690" class="line"/><circle cx="710" cy="462" r="14" fill="#14213d"/>
<rect x="200" y="420" width="165" height="84" rx="42" class="warn"/><text x="282" y="469" text-anchor="middle" class="label">expired</text>
<path d="M282 262 V420" class="line"/><text x="304" y="345" class="tiny">stale evidence / expiry</text>
<path d="M365 462 H420" class="line"/><circle cx="440" cy="462" r="14" fill="#14213d"/>
<!-- execution outcomes -->
<rect x="1090" y="420" width="185" height="84" rx="42" class="terminal"/><text x="1182" y="469" text-anchor="middle" class="label">completed</text>
<rect x="1375" y="420" width="205" height="84" rx="42" class="warn"/><text x="1477" y="469" text-anchor="middle" class="label">needs attention</text>
<rect x="1280" y="640" width="185" height="84" rx="42" class="reject"/><text x="1372" y="689" text-anchor="middle" class="label">failed</text>
<path d="M1372 262 V350 H1182 V420" class="line"/>
<path d="M1372 262 V420 H1477" class="line"/>
<path d="M1372 262 V640" class="line"/>
<text x="1215" y="338" class="tiny">durable execution result</text>
<!-- completed -> outcome observed -->
<rect x="1090" y="640" width="185" height="84" rx="42" class="terminal"/><text x="1182" y="675" text-anchor="middle" class="label">outcome</text><text x="1182" y="696" text-anchor="middle" class="label">observed</text>
<path d="M1182 504 V640" class="line"/><path d="M1275 682 H1330" class="line"/><circle cx="1350" cy="682" r="14" fill="#14213d"/>
<!-- failed terminal -->
<path d="M1465 682 H1520" class="line"/><circle cx="1540" cy="682" r="14" fill="#14213d"/>
<!-- needs attention returns to review -->
<path d="M1477 504 V570 H552 V262" class="line"/><text x="780" y="558" class="tiny">merchant resolves or retries with a new approval</text>

</svg>
