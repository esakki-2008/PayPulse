<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 720" role="img" aria-labelledby="title desc">
<title id="title">PayPulse deployment boundaries</title>
<desc id="desc">PayPulse Phase 1 architecture diagram.</desc>
<style>
  .title { font: 700 25px Arial, Helvetica, sans-serif; fill: #14213d; }
  .subtitle { font: 400 14px Arial, Helvetica, sans-serif; fill: #52607a; }
  .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #14213d; }
  .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #34415c; }
  .tiny { font: 400 11px Arial, Helvetica, sans-serif; fill: #52607a; }
  .node { fill: #ffffff; stroke: #b9c5d8; stroke-width: 2; }
  .source { fill: #e6f4ff; stroke: #3b82b6; stroke-width: 2; }
  .data { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .intelligence { fill: #f3edff; stroke: #7956bf; stroke-width: 2; }
  .action { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .control { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
  .line { fill: none; stroke: #65758d; stroke-width: 2; marker-end: url(#arrow); }
  .line-soft { fill: none; stroke: #8797af; stroke-width: 1.6; marker-end: url(#arrow); }
  .line-loop { fill: none; stroke: #7956bf; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowPurple); }
  .lane { fill: #f8fafc; stroke: #d6deea; stroke-width: 1.5; }
  .participant { fill: #ffffff; stroke: #73839b; stroke-width: 1.5; }
  .life { stroke: #9aa8ba; stroke-width: 1.5; stroke-dasharray: 5 5; }
  .message { fill: none; stroke: #52657f; stroke-width: 1.7; marker-end: url(#arrow); }
  .message-return { fill: none; stroke: #52657f; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .state { fill: #ffffff; stroke: #65758d; stroke-width: 2; }
  .terminal { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .warn { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .reject { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758d"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7956bf"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>

<text x="70" y="58" class="title">PayPulse deployment boundaries</text>
<text x="70" y="84" class="subtitle">Credentials and payment execution stay server-side; browser code uses same-origin authenticated APIs only.</text>
<rect x="70" y="132" width="360" height="490" rx="18" class="lane"/>
<text x="102" y="170" class="label">Browser</text>
<rect x="102" y="200" width="296" height="115" rx="14" class="node"/><text x="250" y="242" text-anchor="middle" class="label">Next.js UI</text><text x="250" y="267" text-anchor="middle" class="small">no provider credentials</text><text x="250" y="289" text-anchor="middle" class="small">no PayPal access token</text>
<rect x="102" y="420" width="296" height="115" rx="14" class="node"/><text x="250" y="462" text-anchor="middle" class="label">Same-origin API calls</text><text x="250" y="487" text-anchor="middle" class="small">authenticated session</text><text x="250" y="509" text-anchor="middle" class="small">relative URLs only</text>
<path d="M250 315 V420" class="line"/>
<rect x="500" y="132" width="680" height="490" rx="18" class="lane"/>
<text x="532" y="170" class="label">Next.js server boundary</text>
<rect x="535" y="200" width="290" height="115" rx="14" class="control"/><text x="680" y="242" text-anchor="middle" class="label">Authenticated API routes</text><text x="680" y="267" text-anchor="middle" class="small">domain commands and queries</text><text x="680" y="289" text-anchor="middle" class="small">tenant + role validation</text>
<rect x="870" y="200" width="275" height="115" rx="14" class="data"/><text x="1007" y="242" text-anchor="middle" class="label">PostgreSQL</text><text x="1007" y="267" text-anchor="middle" class="small">ledger, profiles, approvals</text><text x="1007" y="289" text-anchor="middle" class="small">audit and outcomes</text>
<rect x="535" y="420" width="290" height="115" rx="14" class="intelligence"/><text x="680" y="462" text-anchor="middle" class="label">Gemini adapter</text><text x="680" y="487" text-anchor="middle" class="small">server-only API key</text><text x="680" y="509" text-anchor="middle" class="small">no execution capability</text>
<rect x="870" y="420" width="275" height="115" rx="14" class="action"/><text x="1007" y="462" text-anchor="middle" class="label">PayPal Sandbox adapter</text><text x="1007" y="487" text-anchor="middle" class="small">server-only credentials</text><text x="1007" y="509" text-anchor="middle" class="small">approved execution only</text>
<path d="M398 477 H535 M825 257 H870 M680 315 V420 M1007 315 V420" class="line"/>
<rect x="1250" y="132" width="340" height="490" rx="18" class="lane"/>
<text x="1282" y="170" class="label">External inbound and scheduled traffic</text>
<rect x="1282" y="220" width="276" height="115" rx="14" class="source"/><text x="1420" y="262" text-anchor="middle" class="label">PayPal webhook route</text><text x="1420" y="287" text-anchor="middle" class="small">signature verified</text><text x="1420" y="309" text-anchor="middle" class="small">before persistence</text>
<rect x="1282" y="430" width="276" height="115" rx="14" class="node"/><text x="1420" y="472" text-anchor="middle" class="label">Vercel Cron</text><text x="1420" y="497" text-anchor="middle" class="small">protected sync / recompute</text><text x="1420" y="519" text-anchor="middle" class="small">outbox jobs</text>
<path d="M1282 277 H1145 M1282 487 H1145" class="line-soft"/>

</svg>
