<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 520" role="img" aria-labelledby="title desc">
<title id="title">PayPulse agent loop</title>
<desc id="desc">PayPulse Phase 1 architecture diagram.</desc>
<style>
  .title { font: 700 25px Arial, Helvetica, sans-serif; fill: #14213d; }
  .subtitle { font: 400 14px Arial, Helvetica, sans-serif; fill: #52607a; }
  .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #14213d; }
  .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #34415c; }
  .tiny { font: 400 11px Arial, Helvetica, sans-serif; fill: #52607a; }
  .node { fill: #ffffff; stroke: #b9c5d8; stroke-width: 2; }
  .source { fill: #e6f4ff; stroke: #3b82b6; stroke-width: 2; }
  .data { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .intelligence { fill: #f3edff; stroke: #7956bf; stroke-width: 2; }
  .action { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .control { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
  .line { fill: none; stroke: #65758d; stroke-width: 2; marker-end: url(#arrow); }
  .line-soft { fill: none; stroke: #8797af; stroke-width: 1.6; marker-end: url(#arrow); }
  .line-loop { fill: none; stroke: #7956bf; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowPurple); }
  .lane { fill: #f8fafc; stroke: #d6deea; stroke-width: 1.5; }
  .participant { fill: #ffffff; stroke: #73839b; stroke-width: 1.5; }
  .life { stroke: #9aa8ba; stroke-width: 1.5; stroke-dasharray: 5 5; }
  .message { fill: none; stroke: #52657f; stroke-width: 1.7; marker-end: url(#arrow); }
  .message-return { fill: none; stroke: #52657f; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .state { fill: #ffffff; stroke: #65758d; stroke-width: 2; }
  .terminal { fill: #edf9f1; stroke: #2d8a57; stroke-width: 2; }
  .warn { fill: #fff5df; stroke: #ba7b13; stroke-width: 2; }
  .reject { fill: #ffecef; stroke: #c9576b; stroke-width: 2; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758d"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7956bf"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" rx="18"/>

<text x="70" y="58" class="title">PayPulse agent loop</text>
<text x="70" y="84" class="subtitle">PayPal Sandbox data becomes an explainable, merchant-approved action and feeds the next Payment DNA update.</text>
<g transform="translate(70 145)">
  <rect x="0" y="0" width="182" height="78" rx="14" class="source"/><text x="91" y="33" text-anchor="middle" class="label">PayPal Sandbox</text><text x="91" y="55" text-anchor="middle" class="small">payments &amp; events</text>
  <rect x="246" y="0" width="150" height="78" rx="14" class="node"/><text x="321" y="45" text-anchor="middle" class="label">Observe</text>
  <rect x="460" y="0" width="150" height="78" rx="14" class="node"/><text x="535" y="45" text-anchor="middle" class="label">Understand</text>
  <rect x="674" y="0" width="182" height="78" rx="14" class="intelligence"/><text x="765" y="33" text-anchor="middle" class="label">Payment DNA</text><text x="765" y="55" text-anchor="middle" class="small">baseline &amp; behavior</text>
  <rect x="920" y="0" width="150" height="78" rx="14" class="intelligence"/><text x="995" y="45" text-anchor="middle" class="label">Detect</text>
  <rect x="1134" y="0" width="150" height="78" rx="14" class="intelligence"/><text x="1209" y="45" text-anchor="middle" class="label">Predict</text>
  <path d="M182 39 H246 M396 39 H460 M610 39 H674 M856 39 H920 M1070 39 H1134" class="line"/>
  <path d="M1209 78 V145 H95" class="line"/>
  <rect x="0" y="145" width="190" height="78" rx="14" class="action"/><text x="95" y="178" text-anchor="middle" class="label">Recommend</text><text x="95" y="200" text-anchor="middle" class="small">explain why &amp; impact</text>
  <rect x="254" y="145" width="192" height="78" rx="14" class="control"/><text x="350" y="178" text-anchor="middle" class="label">Human approval</text><text x="350" y="200" text-anchor="middle" class="small">explicit merchant gate</text>
  <rect x="510" y="145" width="206" height="78" rx="14" class="action"/><text x="613" y="178" text-anchor="middle" class="label">Sandbox execution</text><text x="613" y="200" text-anchor="middle" class="small">approved operation only</text>
  <rect x="780" y="145" width="190" height="78" rx="14" class="data"/><text x="875" y="178" text-anchor="middle" class="label">Outcome / memory</text><text x="875" y="200" text-anchor="middle" class="small">record result</text>
  <rect x="1034" y="145" width="206" height="78" rx="14" class="intelligence"/><text x="1137" y="178" text-anchor="middle" class="label">Updated Payment DNA</text><text x="1137" y="200" text-anchor="middle" class="small">learn from outcome</text>
  <path d="M190 184 H254 M446 184 H510 M716 184 H780 M970 184 H1034" class="line"/>
  <path d="M1137 223 V286 H765 V78" class="line-loop"/>
  <text x="824" y="314" class="small" fill="#7956bf">continuous learning loop</text>
</g>

</svg>
